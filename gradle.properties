#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# org.thisisthepy.compose:compose-gradle-plugin:1.11.1-ext.2's Maven Central POM marks
# hot-reload-gradle-plugin as optional (shadow configuration), so Gradle does not place it on the
# plugin classpath unless disabled or declared separately.
org.jetbrains.compose.hot.reload.disable=true
# Coordinates: the one place they are written (#99). A group unification (python-multiplatform #95) changes
# these lines only. A plugin release bumps toolchainVersion and is tagged v<version>; packpackVersion must
# already be on Maven Central then (publish-gradle-plugin.yml checks it).
mavenGroup=org.thisisthepy.python.multiplatform
toolchainVersion=1.0.0-alpha
pluginId=org.thisisthepy.python.multiplatform
packpackModule=org.thisisthepy.python.multiplatform:packpack
packpackVersion=0.1.0
