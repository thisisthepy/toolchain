# toolchain-lite, the PyPI distribution of `tcl`. The wheel carries the native `tcl` command line
# (GraalVM Native Image) and is assembled per platform by .github/scripts/pypi/build_wheel.py in
# publish-pypi.yml, which reads [project] below. Its version must equal toolchain/build.gradle.kts's tclVersion: the
# workflow refuses to publish unless the installed binary prints it.
#
# Installing from source (`uv pip install .`) gives only the Python package, without the binary;
# `python -m toolchain_lite` then says so and exits.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toolchain-lite"
version = "0.1.0"
description = "tcl: install Python packages for a Kotlin Multiplatform app's Python half, no Gradle project needed"
readme = "docs/pypi/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "thisisthepy", email = "thisisthepy@gmail.com" },
]
keywords = ["kotlin-multiplatform", "python", "uv", "packaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/thisisthepy/toolchain"
Documentation = "https://thisisthepy.github.io/toolchain/guide-tcl.html"
Repository = "https://github.com/thisisthepy/toolchain"
Issues = "https://github.com/thisisthepy/toolchain/issues"

[tool.setuptools]
package-dir = { toolchain_lite = "toolchain/src/cliMain/python" }
packages = ["toolchain_lite"]
