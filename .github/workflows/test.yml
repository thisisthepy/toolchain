name: Test

# Every pull request and every push to develop runs the plugin's and tcl's tests,
# each in its own job (AGENTS.md section 8). Results are counted from the JUnit
# XML, not from the log.
#
# Both modules depend on org.thisisthepy.python.multiplatform:packpack:0.1.0 from
# mavenLocal, so each job first publishes it from pypackpack's develop branch.
# --configure-on-demand keeps Gradle from configuring :usage-example, which
# resolves this plugin from mavenLocal and so cannot configure before it is
# published.
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        module: [toolchain, tcl]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/pypackpack
          ref: develop
          path: .ci/pypackpack

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Publish packpack to mavenLocal
        working-directory: .ci/pypackpack
        run: ./gradlew :packpack:publishToMavenLocal --console=plain

      - name: Test ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:test --rerun --configure-on-demand --console=plain

      - name: Count results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          t = f = e = s = 0
          for x in glob.glob("${{ matrix.module }}/build/test-results/test/*.xml"):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(x).read(4000))
              t += int(m[1]); s += int(m[2]); f += int(m[3]); e += int(m[4])
          print(f"tests={t} skipped={s} failures={f} errors={e}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-test-reports
          path: ${{ matrix.module }}/build/reports/tests/test/

  # Unit tests run on Kotlin 2.x's stdlib, but a consumer runs the plugin on the kotlin-stdlib Gradle
  # embeds (1.9.23 for Gradle 8.9). pypackpack#31 broke every suspend call that way and no unit test
  # could see it. This job is a real consumer: it publishes packpack and the plugin, gives
  # usage-example one real pip dependency (CI only), then installs, bundles and zips.
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/pypackpack
          ref: develop
          path: .ci/pypackpack

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - name: Publish packpack and the plugin to mavenLocal
        run: |
          (cd .ci/pypackpack && ./gradlew :packpack:publishToMavenLocal --console=plain)
          ./gradlew :toolchain:publishToMavenLocal --configure-on-demand --console=plain

      - name: Give usage-example one real dependency
        run: |
          python3 - <<'PY'
          f = "usage-example/build.gradle.kts"
          s = open(f).read()
          anchor = '    localLibraryPath = "python"\n'
          assert anchor in s, "usage-example no longer sets localLibraryPath; update this step"
          s = s.replace(anchor, anchor + '    sourceSets { getByName("commonMain").dependencies { implementation("iniconfig") } }\n', 1)
          open(f, "w").write(s)
          PY

      - name: Install, bundle and zip as a consumer
        run: |
          ./gradlew :usage-example:installPythonDependencies :usage-example:buildPython :usage-example:packagePython \
            --console=plain > consumer.log 2>&1 || { cat consumer.log; exit 1; }
          cat consumer.log
          grep -q "iniconfig" consumer.log || { echo "the dependency was not installed"; exit 1; }
          ls -la usage-example/build/distributions/
          # #16: the dependency is installed for the host triple and reaches the payload, not only the venv.
          test -f usage-example/build/pythonDeps/host/iniconfig/__init__.py || { echo "iniconfig was not installed for the host triple"; exit 1; }
          test -f usage-example/build/pythonBundle/python/iniconfig/__init__.py || { echo "iniconfig is not in the bundle"; exit 1; }
          unzip -l usage-example/build/distributions/*.zip | grep -q "python/iniconfig/__init__.py" || { echo "iniconfig is not in the zip"; exit 1; }

  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/guide/check_guide.py
