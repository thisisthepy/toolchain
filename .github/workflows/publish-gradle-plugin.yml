name: Publish the Gradle plugin

# Publishes the plugin (org.thisisthepy.python.multiplatform:toolchain) and its marker
# (org.thisisthepy.python.multiplatform:org.thisisthepy.python.multiplatform.gradle.plugin) to Maven
# Central through the Sonatype Central Portal, the way python-multiplatform's maven-central.yml does
# (toolchain#129; before it, #99 and #116):
#
# - A pushed tag `v<toolchainVersion>` builds, signs with the release key, checks the plugin and its
#   marker (.github/scripts/maven/check_central_bundle.py --plugin-id, gpg --verify) and uploads the
#   bundle as USER_MANAGED (.github/scripts/release/central-upload.sh): the Portal validates it and
#   waits until a person presses Publish or Drop. The plugin's POM depends on packpack, so a release
#   stops while packpackVersion is not on Maven Central (pypackpack publish-maven.yml goes first).
# - A pull request that touches the publishing setup, and a manual run, are dry runs: packpack comes
#   from pypackpack's develop when Central does not have it, the bundle is signed with a key made in
#   the job and thrown away, checked, and kept as a workflow artifact. Nothing is uploaded. A manual
#   run with dry_run off publishes the tag named in "tag".
#
# `toolchain-lite-v*` tags are tcl's (publish-pypi.yml) and do not match `v*`. Repository secrets
# (Settings > Secrets and variables > Actions) read by a real upload, with python-multiplatform's
# names so the same values serve every repository; nothing else reads them:
#   MAVEN_GPG_PRIVATE_KEY   signing key, ASCII armoured (gpg --armor --export-secret-keys)
#   MAVEN_GPG_PASSPHRASE    its passphrase
#   CENTRAL_TOKEN_USERNAME  Central Portal user token, username half
#   CENTRAL_TOKEN_PASSWORD  Central Portal user token, password half
# The signing job has no environment, so the two MAVEN_GPG_* secrets must be repository secrets, not
# environment secrets. The upload runs in the environment "maven-central", where required reviewers
# can be set.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign with a throwaway key, upload nothing'
        type: boolean
        default: true
      tag:
        description: 'Tag to publish when dry_run is off (v<version>); ignored for a dry run'
        required: false
        default: ''
      publishing_type:
        description: 'USER_MANAGED waits in the Central Portal for someone to press Publish; AUTOMATIC publishes once validated'
        type: choice
        options: [USER_MANAGED, AUTOMATIC]
        default: USER_MANAGED

permissions:
  contents: read

concurrency:
  group: publish-gradle-plugin-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Build, sign and check the bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release builds the tag's own gradle.properties, not the branch it was cut from.
          ref: ${{ (github.event_name == 'push' || inputs.dry_run == false) && (github.event.inputs.tag || github.ref) || github.ref }}

      - name: The tag names the version; packpack is on Central; the version is new on Central
        run: |
          set -euo pipefail
          prop() { sed -n "s/^$1=//p" gradle.properties; }
          group=$(prop mavenGroup); version=$(prop toolchainVersion); plugin=$(prop pluginId)
          packpack=$(prop packpackModule); packpack_version=$(prop packpackVersion)
          echo "plugin $plugin $version ($group:toolchain)   packpack $packpack:$packpack_version   dry run: $DRY_RUN   tag: $TAG"
          { echo "GROUP=$group"; echo "VERSION=$version"; echo "PLUGIN_ID=$plugin"; } >> "$GITHUB_ENV"
          fail() { if [ "$DRY_RUN" != true ]; then echo "::error::$1"; exit 1; else echo "::warning::$1"; fi; }
          if [ "$DRY_RUN" != true ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag '$TAG' is not 'v$version' (gradle.properties toolchainVersion)"; exit 1
          fi
          pp_group=${packpack%%:*}; pp_artifact=${packpack##*:}
          if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/${pp_group//.//}/$pp_artifact/$packpack_version/$pp_artifact-$packpack_version.pom"; then
            echo "PACKPACK_ON_CENTRAL=true" >> "$GITHUB_ENV"
          else
            echo "PACKPACK_ON_CENTRAL=false" >> "$GITHUB_ENV"
            fail "$packpack:$packpack_version is not on Maven Central; publish packpack first (pypackpack publish-maven.yml)"
          fi
          pom="https://repo1.maven.org/maven2/${group//.//}/toolchain/$version/toolchain-$version.pom"
          if curl -fsS -o /dev/null "$pom"; then fail "$group:toolchain:$version is already on Maven Central; bump toolchainVersion"; fi
          marker="https://repo1.maven.org/maven2/${plugin//.//}/$plugin.gradle.plugin/$version/$plugin.gradle.plugin-$version.pom"
          if curl -fsS -o /dev/null "$marker"; then fail "$plugin $version marker is already on Maven Central; bump toolchainVersion"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: The signing key (throwaway for a dry run, the release key otherwise)
        env:
          RELEASE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          RELEASE_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Outside the workspace: gpg-agent's socket path must stay short.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          if [ "$DRY_RUN" = true ]; then
            gpg --batch --quiet --passphrase '' --quick-generate-key "toolchain dry run <dry-run@invalid>" rsa3072 sign 1d
            key="$(gpg --batch --pinentry-mode loopback --passphrase '' --armor --export-secret-keys)"
            passphrase=""
          else
            [ -n "$RELEASE_KEY" ] || { echo "::error::repository secret MAVEN_GPG_PRIVATE_KEY is missing (Settings > Secrets and variables > Actions)"; exit 1; }
            gpg --batch --quiet --import <<< "$RELEASE_KEY"
            key="$RELEASE_KEY"; passphrase="$RELEASE_PASSPHRASE"
          fi
          # toolchain/build.gradle.kts signs when the Gradle property signingInMemoryKey is set.
          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<SIGNING_KEY_EOF"; echo "$key"; echo "SIGNING_KEY_EOF"
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=$passphrase"
          } >> "$GITHUB_ENV"

      # A dry run before packpack's first release builds it from pypackpack's develop into
      # mavenLocal, as test.yml does. A release never gets here without packpack on Central.
      - name: packpack, from pypackpack, when Central does not have it yet
        if: env.PACKPACK_ON_CENTRAL != 'true'
        run: |
          git clone --depth 1 --branch develop https://github.com/thisisthepy/pypackpack.git "$RUNNER_TEMP/pypackpack"
          (cd "$RUNNER_TEMP/pypackpack" && ./gradlew :packpack:publishToMavenLocal --console=plain)

      - name: Stage and zip the bundle
        run: ./gradlew :toolchain:centralBundle --console=plain

      - name: The bundle meets Central's requirements, and every signature verifies
        run: |
          set -euo pipefail
          python3 .github/scripts/maven/check_central_bundle.py toolchain/build/staging-deploy "$GROUP" toolchain "$VERSION" --plugin-id "$PLUGIN_ID"
          fail=0; n=0
          while IFS= read -r f; do
            n=$((n + 1))
            gpg --batch --quiet --verify "$f.asc" "$f" 2>/dev/null || { echo "::error::bad or missing signature on $f"; fail=1; }
          done < <(find toolchain/build/staging-deploy -type f -not -name '*.asc' -not -name '*.md5' -not -name '*.sha1' \
                     -not -name '*.sha256' -not -name '*.sha512' -not -name 'maven-metadata*')
          echo "$n signed files verified"
          [ "$fail" = 0 ] && [ "$n" -gt 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: toolchain/build/central/central-bundle-${{ env.VERSION }}.zip
          retention-days: 14

  upload:
    name: Upload to the Central Portal
    needs: bundle
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Required reviewers can be set on this environment, so even a pushed tag waits for a person
    # before anything reaches Central. A dry run never gets here.
    environment: maven-central
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          sparse-checkout: |
            .github/scripts/release
            gradle.properties
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: central-bundle
          path: ${{ runner.temp }}

      - name: Upload (USER_MANAGED unless chosen otherwise; press Publish in the Portal)
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          TYPE: ${{ inputs.publishing_type || 'USER_MANAGED' }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^toolchainVersion=//p' gradle.properties)
          .github/scripts/release/central-upload.sh "$RUNNER_TEMP/central-bundle-$version.zip" "toolchain $version" "$TYPE"
