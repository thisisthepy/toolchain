name: Publish the Gradle plugin

# Publishing a GitHub Release tagged `v<version>` (the plugin's tags, #71) signs and stages the plugin
# (`org.thisisthepy.python.multiplatform:toolchain`) and its marker
# (`org.thisisthepy.python.multiplatform:org.thisisthepy.python.multiplatform.gradle.plugin`), checks
# the bundle against Maven Central's requirements (.github/scripts/maven/check_central_bundle.py --plugin-id)
# and uploads it to the Sonatype Central Portal as USER_MANAGED: the Portal validates it and waits, and
# a person presses Publish there. A manual run does everything except the upload (#99, #116).
#
# Nothing can upload until the user has created the `maven-central` environment (restricted to
# `v*` tags) with its four secrets and published such a release; without a secret the job stops
# and names it. The plugin depends on packpack, which consumers resolve from Maven Central, so the
# job also stops while gradle.properties' packpackVersion is not on Central. docs/SPEC.md §1.19.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gradle-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Releases tagged toolchain-lite-v* are tcl's (publish-pypi.yml).
    if: github.event_name != 'release' || (startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'release' && 'maven-central' || '' }}
    env:
      IS_RELEASE: ${{ github.event_name == 'release' }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the version; packpack is on Central; the version is new on Central
        run: |
          prop() { sed -n "s/^$1=//p" gradle.properties; }
          group=$(prop mavenGroup); version=$(prop toolchainVersion); plugin=$(prop pluginId)
          packpack=$(prop packpackModule); packpack_version=$(prop packpackVersion)
          echo "plugin $plugin $version ($group:toolchain)   packpack $packpack:$packpack_version   tag: ${TAG:-none (dry run)}"
          { echo "GROUP=$group"; echo "VERSION=$version"; echo "PLUGIN_ID=$plugin"; } >> "$GITHUB_ENV"
          fail() { if [ "$IS_RELEASE" = true ]; then echo "::error::$1"; exit 1; else echo "::warning::$1"; fi; }
          if [ "$IS_RELEASE" = true ] && [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' is not 'v$version' (gradle.properties toolchainVersion)"; exit 1
          fi
          pp_group=${packpack%%:*}; pp_artifact=${packpack##*:}
          curl -fsS -o /dev/null "https://repo1.maven.org/maven2/${pp_group//.//}/$pp_artifact/$packpack_version/$pp_artifact-$packpack_version.pom" \
            || fail "$packpack:$packpack_version is not on Maven Central; publish packpack first (pypackpack publish-maven.yml)"
          pom="https://repo1.maven.org/maven2/${group//.//}/toolchain/$version/toolchain-$version.pom"
          if curl -fsS -o /dev/null "$pom"; then fail "$group:toolchain:$version is already on Maven Central; bump toolchainVersion"; fi
          marker="https://repo1.maven.org/maven2/${plugin//.//}/$plugin.gradle.plugin/$version/$plugin.gradle.plugin-$version.pom"
          if curl -fsS -o /dev/null "$marker"; then fail "$plugin $version marker is already on Maven Central; bump toolchainVersion"; fi

      - name: The publishing secrets are there
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          missing=""
          for name in SIGNING_KEY SIGNING_KEY_PASSWORD CENTRAL_PORTAL_USERNAME CENTRAL_PORTAL_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "$IS_RELEASE" = true ]; then
              echo "::error::missing secrets in the maven-central environment:$missing (docs/SPEC.md §1.19)"; exit 1
            fi
            echo "::notice::dry run without:$missing; the bundle is built unsigned and nothing is uploaded"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The plugin builds against packpack; until packpack is on Maven Central (a dry run before its
      # first release), build it from pypackpack's develop into mavenLocal, as test.yml does.
      - name: packpack, from pypackpack, when Central does not have it yet
        if: github.event_name != 'release'
        run: |
          prop() { sed -n "s/^$1=//p" gradle.properties; }
          packpack=$(prop packpackModule); v=$(prop packpackVersion); g=${packpack%%:*}; a=${packpack##*:}
          if ! curl -fsS -o /dev/null "https://repo1.maven.org/maven2/${g//.//}/$a/$v/$a-$v.pom"; then
            git clone --depth 1 --branch develop https://github.com/thisisthepy/pypackpack.git "$RUNNER_TEMP/pypackpack"
            (cd "$RUNNER_TEMP/pypackpack" && ./gradlew :packpack:publishToMavenLocal --console=plain)
          fi

      - name: Stage the bundle (signed when a key is there)
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
          fi
          ./gradlew :toolchain:centralBundle --console=plain

      - name: The plugin and its marker meet Central's requirements
        env:
          SIGNED: ${{ secrets.SIGNING_KEY != '' }}
        run: |
          flag=""
          [ "$SIGNED" = true ] || flag="--unsigned"
          python3 .github/scripts/maven/check_central_bundle.py toolchain/build/staging-deploy "$GROUP" toolchain "$VERSION" --plugin-id "$PLUGIN_ID" $flag

      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ env.VERSION }}
          path: toolchain/build/central/central-bundle-${{ env.VERSION }}.zip

      - name: Upload to the Central Portal (USER_MANAGED; press Publish in the Portal)
        if: github.event_name == 'release'
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_PORTAL_USERNAME" "$CENTRAL_PORTAL_PASSWORD" | base64 -w0)
          id=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@toolchain/build/central/central-bundle-$VERSION.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED&name=toolchain-$VERSION")
          echo "Central Portal deployment: $id"
          echo "::notice::uploaded as deployment $id; check it at https://central.sonatype.com/publishing/deployments and press Publish"
